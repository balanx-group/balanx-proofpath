name: Copilot setup steps

on:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: balanx-azure-balanx-proofpath-copilot
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Verify Ubuntu x64 setup environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          . /etc/os-release
          test "$ID" = ubuntu
          git --version
