name: BrowserStack web QA

on:
  workflow_dispatch:
    inputs:
      account_use_confirmed:
        description: 'Confirm Automate Playwright is eligible for this repo and intended use under the selected plan, including any student or commercial-use terms'
        required: true
        type: boolean
        default: false
      usage_funding_confirmed:
        description: 'Use eligible student benefits and included usage first; confirm any remainder is covered by existing pay-as-you-go billing'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: browserstack-web
  cancel-in-progress: false

jobs:
  browserstack:
    # Confirm current plan eligibility and available funding before each run.
    # This job condition is evaluated before a hosted runner is allocated.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref_name == github.event.repository.default_branch &&
      inputs.account_use_confirmed && inputs.usage_funding_confirmed
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify BrowserStack credentials are configured
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          if [[ -z "$BROWSERSTACK_USERNAME" || -z "$BROWSERSTACK_ACCESS_KEY" ]]; then
            echo "::error::Add BROWSERSTACK_USERNAME and BROWSERSTACK_ACCESS_KEY to GitHub Actions secrets."
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'

      - name: Install the Playwright client
        run: npm install --prefix "$RUNNER_TEMP/bs-playwright" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.63.0

      - name: Stage the checked-out web files
        run: |
          mkdir -p "$RUNNER_TEMP/bs-web"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/bs-web"

      - name: Start the isolated BrowserStack Local tunnel
        id: tunnel
        uses: browserstack/github-actions/setup-local@1fad39ae4755588f7fc6854da6c3efba2bf5d08f
        env:
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        with:
          local-testing: start
          local-identifier: gha-${{ github.run_id }}-${{ github.run_attempt }}
          local-args: --only 127.0.0.1,8080,0

      - name: Run the browser smoke test
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          env -u BROWSERSTACK_USERNAME -u BROWSERSTACK_ACCESS_KEY python3 -m http.server 8080 --bind 127.0.0.1 --directory "$RUNNER_TEMP/bs-web/." > "$RUNNER_TEMP/bs-web.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 5 --retry-connrefused --max-time 5 http://127.0.0.1:8080/ > /dev/null
          node <<'BROWSERSTACK_NODE'
          const { chromium } = require(process.env.RUNNER_TEMP + '/bs-playwright/node_modules/playwright')
          const { version } = require(process.env.RUNNER_TEMP + '/bs-playwright/node_modules/playwright/package.json')
          const caps = {
            browser: 'chrome', browser_version: 'latest', os: 'Windows', os_version: '11',
            project: process.env.GITHUB_REPOSITORY,
            build: 'GitHub Actions ' + process.env.GITHUB_RUN_NUMBER + '.' + process.env.GITHUB_RUN_ATTEMPT,
            name: 'Browser smoke test',
            'client.playwrightVersion': version,
            'browserstack.username': process.env.BROWSERSTACK_USERNAME,
            'browserstack.accessKey': process.env.BROWSERSTACK_ACCESS_KEY,
            'browserstack.local': 'true',
            'browserstack.localIdentifier': process.env.BROWSERSTACK_LOCAL_IDENTIFIER,
            'browserstack.debug': 'false',
            'browserstack.video': 'false',
            'browserstack.networkLogs': 'false',
            'browserstack.console': 'disable',
          }

          async function smoke() {
            if (!caps['browserstack.localIdentifier']) throw new Error('BrowserStack Local is required')
            const endpoint = 'wss://cdp.browserstack.com/playwright?caps=' + encodeURIComponent(JSON.stringify(caps))
            const browser = await chromium.connect(endpoint, { timeout: 90_000 })
            try {
              const page = await browser.newPage()
              page.setDefaultTimeout(20_000)
              const result = await page.goto('http://127.0.0.1:8080/')
              if (!result?.ok()) throw new Error('Local site did not return a successful response')
              await page.getByRole('heading', { name: 'Can this request safely move forward?' }).waitFor()
              await page.locator('#case-title').waitFor()
              if (!(await page.locator('#case-title').innerText()).trim()) throw new Error('No synthetic case loaded')
              await page.getByRole('button', { name: /Check decision/ }).waitFor()
              await page.evaluate(() => {}, 'browserstack_executor: ' + JSON.stringify({
                action: 'setSessionStatus', arguments: { status: 'passed', reason: 'Browser smoke test passed' },
              }))
            } finally {
              await browser.close()
            }
          }
          smoke().catch(error => {
            console.error('BrowserStack smoke test failed:', error.message)
            process.exitCode = 1
          })
          BROWSERSTACK_NODE

      - name: Stop BrowserStack Local
        if: always() && steps.tunnel.outcome == 'success'
        uses: browserstack/github-actions/setup-local@1fad39ae4755588f7fc6854da6c3efba2bf5d08f
        env:
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        with:
          local-testing: stop
          local-identifier: gha-${{ github.run_id }}-${{ github.run_attempt }}
